name: Build Templar KernelSU Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Templar KSUN
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      KERNEL_BRANCH: Templar-LinuxStable
      LLVM_PATH: /usr/lib/llvm-22/bin

    steps:

      # ============================================================
      # CHECKOUT KERNEL
      # ============================================================

      - name: Checkout Templar Kernel
        uses: actions/checkout@v4
        with:
          ref: Templar-LinuxStable
          fetch-depth: 0
          submodules: recursive

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            gcc \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            pahole \
            perl \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # LLVM 22
      # ============================================================

      - name: Install LLVM 22
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALLING LLVM 22"
          echo "========================================"

          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 22

          sudo apt-get install -y \
            clang-22 \
            lld-22 \
            llvm-22 \
            llvm-22-dev \
            llvm-22-tools

          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

          export PATH="/usr/lib/llvm-22/bin:${PATH}"

          echo
          echo "========================================"
          echo "LLVM VERSION"
          echo "========================================"

          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy
          command -v llvm-strip

          clang --version
          ld.lld --version

      # ============================================================
      # KERNEL INFORMATION
      # ============================================================

      - name: Kernel Information
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "KERNEL INFORMATION"
          echo "========================================"

          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Commit:"
          git log -1 --oneline

          echo
          echo "Kernel version:"
          grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' Makefile

      # ============================================================
      # INSTALL KERNELSU NEXT
      # ============================================================

      - name: Install KernelSU Next
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:${PATH}"

          echo "========================================"
          echo "INSTALLING KERNELSU NEXT"
          echo "========================================"

          curl --fail --location --proto '=https' -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s next

          echo
          echo "========================================"
          echo "KERNELSU NEXT INFORMATION"
          echo "========================================"

          if [ ! -d "KernelSU-Next" ]; then
            echo "ERROR: KernelSU-Next directory not found"
            exit 1
          fi

          echo "KSU Next commit:"
          git -C KernelSU-Next rev-parse HEAD

          echo
          echo "KSU Next:"
          git -C KernelSU-Next log -1 --oneline

          echo
          echo "KSU Next tag:"
          git -C KernelSU-Next describe --tags --always || true

      # ============================================================
      # VERIFY KSU INTEGRATION
      # ============================================================

      - name: Verify KernelSU Next Integration
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING KERNELSU NEXT"
          echo "========================================"

          if [ ! -e "drivers/kernelsu" ]; then
            echo "ERROR: drivers/kernelsu does not exist"
            exit 1
          fi

          echo
          echo "drivers/kernelsu:"
          ls -la drivers/kernelsu

          echo
          echo "KernelSU source:"
          readlink -f drivers/kernelsu || true

      # ============================================================
      # OPTIONAL SUSFS
      #
      # SUSFS IS OPTIONAL.
      #
      # 1. Clone official SUSFS
      # 2. Test KSU patch
      # 3. Test kernel patch
      # 4. ONLY apply if both tests pass
      # 5. If anything fails -> SUSFS skipped
      # ============================================================

      - name: Try SUSFS
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "OPTIONAL SUSFS"
          echo "========================================"

          SUSFS_ENABLED=false

          rm -rf susfs4ksu

          # --------------------------------------------------------
          # Clone SUSFS
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "CLONING OFFICIAL SUSFS"
          echo "========================================"

          if ! git clone \
            --depth=1 \
            --branch gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs4ksu; then

            echo "WARNING: SUSFS clone failed."
            echo "SUSFS will be skipped."

            echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo
          echo "SUSFS commit:"
          git -C susfs4ksu rev-parse HEAD

          echo
          echo "SUSFS:"
          git -C susfs4ksu log -1 --oneline

          # --------------------------------------------------------
          # Patch paths
          # --------------------------------------------------------

          KSU_PATCH="${GITHUB_WORKSPACE}/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          KERNEL_PATCH="${GITHUB_WORKSPACE}/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch"

          # --------------------------------------------------------
          # Verify files
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "VERIFYING SUSFS FILES"
          echo "========================================"

          if [ ! -f "$KSU_PATCH" ]; then
            echo "WARNING: KSU SUSFS patch missing."
            echo "SUSFS will be skipped."

            echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ ! -f "$KERNEL_PATCH" ]; then
            echo "WARNING: Kernel SUSFS patch missing."
            echo "SUSFS will be skipped."

            echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "KSU patch:"
          echo "$KSU_PATCH"

          echo
          echo "Kernel patch:"
          echo "$KERNEL_PATCH"

          # --------------------------------------------------------
          # Verify source files
          # --------------------------------------------------------

          if [ ! -f \
            "${GITHUB_WORKSPACE}/susfs4ksu/kernel_patches/fs/susfs.c" ]; then

            echo "WARNING: susfs.c missing."
            echo "SUSFS will be skipped."

            echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # --------------------------------------------------------
          # TEST KSU PATCH
          #
          # IMPORTANT:
          # --dry-run does NOT modify the source tree.
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "TESTING KERNELSU SUSFS PATCH"
          echo "========================================"

          cd "${GITHUB_WORKSPACE}/KernelSU-Next"

          if patch \
            --dry-run \
            -p1 \
            --forward \
            < "$KSU_PATCH" \
            > /tmp/susfs_ksu_test.log 2>&1; then

            echo
            echo "KernelSU SUSFS patch:"
            echo "COMPATIBLE"

          else

            echo
            echo "KernelSU SUSFS patch:"
            echo "NOT COMPATIBLE"

            echo
            echo "Patch output:"
            cat /tmp/susfs_ksu_test.log

            echo
            echo "SUSFS skipped."

            echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # --------------------------------------------------------
          # TEST KERNEL PATCH
          #
          # We test BEFORE applying anything.
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "TESTING KERNEL SUSFS PATCH"
          echo "========================================"

          cd "${GITHUB_WORKSPACE}"

          # Check whether patch can apply to this kernel.
          if patch \
            --dry-run \
            -p1 \
            --forward \
            < "$KERNEL_PATCH" \
            > /tmp/susfs_kernel_test.log 2>&1; then

            echo
            echo "Kernel SUSFS patch:"
            echo "COMPATIBLE"

          else

            echo
            echo "Kernel SUSFS patch:"
            echo "NOT COMPATIBLE"

            echo
            echo "Patch output:"
            cat /tmp/susfs_kernel_test.log

            echo
            echo "SUSFS skipped."

            echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # --------------------------------------------------------
          # APPLY KSU PATCH
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "APPLYING KERNELSU SUSFS PATCH"
          echo "========================================"

          cd "${GITHUB_WORKSPACE}/KernelSU-Next"

          patch \
            -p1 \
            --forward \
            < "$KSU_PATCH"

          # --------------------------------------------------------
          # COPY SUSFS SOURCE
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "COPYING SUSFS SOURCES"
          echo "========================================"

          cd "${GITHUB_WORKSPACE}"

          cp \
            susfs4ksu/kernel_patches/fs/* \
            fs/

          cp \
            susfs4ksu/kernel_patches/include/linux/* \
            include/linux/

          # --------------------------------------------------------
          # APPLY KERNEL PATCH
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "APPLYING KERNEL SUSFS PATCH"
          echo "========================================"

          patch \
            -p1 \
            --forward \
            < "$KERNEL_PATCH"

          # --------------------------------------------------------
          # SUCCESS
          # --------------------------------------------------------

          SUSFS_ENABLED=true

          echo "SUSFS_ENABLED=true" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "SUSFS ENABLED"
          echo "========================================"

          echo "SUSFS commit:"
          git -C susfs4ksu rev-parse HEAD

      # ============================================================
      # CONFIGURE KERNEL
      # ============================================================

      - name: Configure Kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:${PATH}"

          echo "========================================"
          echo "CONFIGURING KERNEL"
          echo "========================================"

          # --------------------------------------------------------
          # DEFCONFIG
          # --------------------------------------------------------

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            defconfig

          # --------------------------------------------------------
          # KERNELSU NEXT
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "KERNELSU NEXT CONFIG"
          echo "========================================"

          ./scripts/config --enable CONFIG_KSU

          # --------------------------------------------------------
          # KPROBES
          # --------------------------------------------------------

          ./scripts/config --enable CONFIG_KPROBES
          ./scripts/config --enable CONFIG_HAVE_KPROBES
          ./scripts/config --enable CONFIG_KPROBE_EVENTS

          # --------------------------------------------------------
          # WIFI
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "WIRELESS CONFIG"
          echo "========================================"

          ./scripts/config --enable CONFIG_WIRELESS
          ./scripts/config --enable CONFIG_CFG80211
          ./scripts/config --enable CONFIG_MAC80211
          ./scripts/config --enable CONFIG_RFKILL

          # --------------------------------------------------------
          # THINLTO
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "THINLTO CONFIG"
          echo "========================================"

          ./scripts/config --enable CONFIG_LTO
          ./scripts/config --enable CONFIG_LTO_CLANG
          ./scripts/config --disable CONFIG_LTO_CLANG_FULL
          ./scripts/config --enable CONFIG_LTO_CLANG_THIN

          # --------------------------------------------------------
          # SUSFS CONFIG
          # ONLY IF SUSFS PATCH WAS SUCCESSFUL
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "SUSFS CONFIG"
          echo "========================================"

          if [ "${SUSFS_ENABLED:-false}" = "true" ]; then

            echo "SUSFS was successfully applied."
            echo "Enabling SUSFS configuration."

            ./scripts/config --enable CONFIG_KSU_SUSFS
            ./scripts/config --enable CONFIG_KSU_SUSFS_SUS_PATH
            ./scripts/config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
            ./scripts/config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
            ./scripts/config --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
            ./scripts/config --enable CONFIG_KSU_SUSFS_ENABLE_LOG
            ./scripts/config --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            ./scripts/config --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            ./scripts/config --enable CONFIG_KSU_SUSFS_SUS_MAP
            ./scripts/config --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT

          else

            echo "SUSFS was skipped."
            echo "Building KernelSU Next without SUSFS."

            # Make absolutely sure no stale SUSFS config remains.
            ./scripts/config --disable CONFIG_KSU_SUSFS || true
            ./scripts/config --disable CONFIG_KSU_SUSFS_SUS_PATH || true
            ./scripts/config --disable CONFIG_KSU_SUSFS_SUS_MOUNT || true
            ./scripts/config --disable CONFIG_KSU_SUSFS_SUS_KSTAT || true
            ./scripts/config --disable CONFIG_KSU_SUSFS_SPOOF_UNAME || true
            ./scripts/config --disable CONFIG_KSU_SUSFS_ENABLE_LOG || true
            ./scripts/config --disable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS || true
            ./scripts/config --disable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG || true
            ./scripts/config --disable CONFIG_KSU_SUSFS_SUS_MAP || true
            ./scripts/config --disable CONFIG_KSU_SUSFS_OPEN_REDIRECT || true

          fi

          # --------------------------------------------------------
          # FINALIZE CONFIG
          # --------------------------------------------------------

          echo
          echo "========================================"
          echo "FINALIZING CONFIG"
          echo "========================================"

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      # ============================================================
      # SHOW CONFIG
      # ============================================================

      - name: Show Final Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FINAL KERNEL CONFIGURATION"
          echo "========================================"

          echo
          echo "========== KERNELSU =========="

          grep -E \
            '^(CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_HAVE_KPROBES=|CONFIG_KPROBE_EVENTS=)' \
            .config || true

          echo
          echo "========== WIRELESS =========="

          grep -E \
            '^(CONFIG_WIRELESS=|CONFIG_CFG80211=|CONFIG_MAC80211=|CONFIG_RFKILL=)' \
            .config || true

          echo
          echo "========== LTO =========="

          grep -E \
            '^(CONFIG_LTO=|CONFIG_LTO_CLANG=|CONFIG_LTO_CLANG_FULL=|CONFIG_LTO_CLANG_THIN=)' \
            .config || true

          echo
          echo "========== SUSFS =========="

          grep '^CONFIG_KSU_SUSFS' .config || \
            echo "SUSFS: NOT ENABLED"

          echo
          echo "========================================"
          echo "SUSFS STATUS: ${SUSFS_ENABLED:-false}"
          echo "========================================"

      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build Kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:${PATH}"

          echo "========================================"
          echo "BUILDING TEMPLAR KERNEL"
          echo "========================================"

          echo
          echo "Compiler:"
          clang --version | head -n 1

          echo
          echo "Linker:"
          ld.lld --version | head -n 1

          echo
          echo "CPU:"
          nproc

          echo
          echo "Kernel:"
          grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' Makefile

          echo
          echo "SUSFS:"
          echo "${SUSFS_ENABLED:-false}"

          echo
          echo "========================================"
          echo "MAKE IMAGE"
          echo "========================================"

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LTO=thin \
            CROSS_COMPILE= \
            CROSS_COMPILE_COMPAT= \
            -j2 \
            Image

      # ============================================================
      # VERIFY IMAGE
      # ============================================================

      - name: Verify Kernel Image
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING KERNEL IMAGE"
          echo "========================================"

          IMAGE="arch/arm64/boot/Image"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Image not found!"
            exit 1
          fi

          echo
          echo "Image:"
          ls -lh "$IMAGE"

          echo
          echo "File:"
          file "$IMAGE"

          echo
          echo "Kernel version:"
          strings "$IMAGE" | grep -m1 "Linux version" || true

      # ============================================================
      # VERIFY KSU / SUSFS IN CONFIG
      # ============================================================

      - name: Final Verification
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FINAL VERIFICATION"
          echo "========================================"

          echo
          echo "KERNELSU:"
          grep '^CONFIG_KSU=' .config || true

          echo
          echo "KPROBES:"
          grep -E \
            '^CONFIG_(KPROBES|HAVE_KPROBES|KPROBE_EVENTS)=' \
            .config || true

          echo
          echo "WIRELESS:"
          grep -E \
            '^CONFIG_(WIRELESS|CFG80211|MAC80211|RFKILL)=' \
            .config || true

          echo
          echo "THINLTO:"
          grep -E \
            '^CONFIG_(LTO|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN)=' \
            .config || true

          echo
          echo "SUSFS STATUS:"
          echo "${SUSFS_ENABLED:-false}"

          echo
          echo "SUSFS CONFIG:"
          grep '^CONFIG_KSU_SUSFS' .config || \
            echo "SUSFS CONFIG NOT PRESENT"

          echo
          echo "========================================"
          echo "BUILD VERIFICATION COMPLETE"
          echo "========================================"

      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================

      - name: Prepare Artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          cp \
            arch/arm64/boot/Image \
            output/Image

          cp \
            .config \
            output/kernel.config

          if [ -f System.map ]; then
            cp System.map output/System.map
          fi

          if [ -f Module.symvers ]; then
            cp Module.symvers output/Module.symvers
          fi

          echo "========================================"
          echo "OUTPUT FILES"
          echo "========================================"

          ls -lah output

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Templar-KernelSU-Next-5.10.269
          path: output/
          if-no-files-found: error
          retention-days: 14
