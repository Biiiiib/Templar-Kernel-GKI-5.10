name: Build Templar KSU SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # CHECKOUT TEMPLAR
      # =========================================================

      - name: Checkout Templar
        uses: actions/checkout@v4
        with:
          ref: Templar-LinuxStable
          fetch-depth: 1


      # =========================================================
      # DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALLING DEPENDENCIES"
          echo "========================================"

          sudo apt update

          sudo apt install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            pahole \
            cpio \
            lz4 \
            gzip \
            zip \
            unzip \
            rsync \
            git \
            curl \
            wget \
            python3 \
            ca-certificates \
            file


      # =========================================================
      # LLVM 22
      # =========================================================

      - name: Install LLVM 22
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALLING LLVM 22"
          echo "========================================"

          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh

          sudo ./llvm.sh 22

          # Make LLVM 22 active in THIS step.
          export PATH="/usr/lib/llvm-22/bin:$PATH"

          # Make LLVM 22 active in all FOLLOWING steps.
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

          echo
          echo "========================================"
          echo "LLVM TOOLCHAIN"
          echo "========================================"

          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy
          command -v llvm-strip

          echo
          clang --version

          echo
          ld.lld --version

          echo
          llvm-ar --version | head -n 1

          echo
          llvm-nm --version | head -n 1

          echo
          llvm-objcopy --version | head -n 1

          echo
          llvm-strip --version | head -n 1

          echo
          echo "LLVM 22 CHECK PASSED."


      # =========================================================
      # KERNELSU
      # =========================================================

      - name: Install KernelSU
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALLING KERNELSU"
          echo "========================================"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -

          echo
          echo "========================================"
          echo "KERNELSU INFORMATION"
          echo "========================================"

          test -d KernelSU

          echo
          echo "===== HEAD ====="

          git -C KernelSU log -1 --oneline

          echo
          echo "===== COMMIT ====="

          git -C KernelSU rev-parse HEAD

          echo
          echo "===== TAG ====="

          git -C KernelSU describe --tags --always || true

          echo
          echo "===== BRANCH ====="

          git -C KernelSU branch -a || true

          echo
          echo "===== KERNELSU DIRECTORY ====="

          find KernelSU/kernel \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -150

          echo
          echo "========================================"
          echo "CHECKING SUSFS TARGET FILES"
          echo "========================================"

          for f in \
            KernelSU/kernel/selinux/rules.c \
            KernelSU/kernel/selinux/selinux.c \
            KernelSU/kernel/selinux/selinux.h \
            KernelSU/kernel/setuid_hook.c \
            KernelSU/kernel/sucompat.c \
            KernelSU/kernel/sucompat.h \
            KernelSU/kernel/supercalls.c
          do
            if [ -f "$f" ]; then
              echo "FOUND   : $f"
            else
              echo "MISSING : $f"
            fi
          done


      # =========================================================
      # CLONE SUSFS
      # =========================================================

      - name: Clone SUSFS
        shell: bash
        run: |
          set -euo pipefail

          SUSFS_BRANCH="gki-android12-5.10"

          echo "========================================"
          echo "CLONING SUSFS"
          echo "========================================"

          echo "Branch: $SUSFS_BRANCH"

          git clone \
            --depth=1 \
            --branch "$SUSFS_BRANCH" \
            https://github.com/deepongi-labs/susfs4ksu.git \
            susfs

          echo
          echo "========================================"
          echo "SUSFS INFORMATION"
          echo "========================================"

          echo
          echo "===== COMMIT ====="

          git -C susfs rev-parse HEAD

          echo
          echo "===== LOG ====="

          git -C susfs log -1 --oneline

          echo
          echo "===== BRANCH ====="

          git -C susfs branch --show-current

          echo
          echo "===== TAG ====="

          git -C susfs describe --tags --always || true

          echo
          echo "========================================"
          echo "SUSFS PATCH FILES"
          echo "========================================"

          find susfs/kernel_patches \
            -type f \
            | sort


      # =========================================================
      # APPLY SUSFS
      # =========================================================

      - name: Apply SUSFS
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PREPARING SUSFS PATCH"
          echo "========================================"

          echo
          echo "===== AVAILABLE KSU PATCHES ====="

          find susfs/kernel_patches/KernelSU \
            -type f \
            -name '*.patch' \
            | sort

          echo
          echo "===== AVAILABLE KERNEL PATCHES ====="

          find susfs/kernel_patches \
            -type f \
            -name '*.patch' \
            | sort

          # -----------------------------------------------------
          # Locate KernelSU SUSFS patch
          # -----------------------------------------------------

          PATCH_KSU="$(
            find susfs/kernel_patches/KernelSU \
              -type f \
              -name '10_enable_susfs_for_ksu.patch' \
              | sort \
              | head -n 1
          )"

          # Fallback if filename changes in future SUSFS branch.
          if [ -z "$PATCH_KSU" ]; then
            PATCH_KSU="$(
              find susfs/kernel_patches/KernelSU \
                -type f \
                -iname '*enable*susfs*.patch' \
                | sort \
                | head -n 1
            )"
          fi

          # -----------------------------------------------------
          # Locate 5.10 kernel patch
          # -----------------------------------------------------

          PATCH_KERNEL="$(
            find susfs/kernel_patches \
              -type f \
              -name '*5.10*.patch' \
              | sort \
              | head -n 1
          )"

          echo
          echo "========================================"
          echo "SELECTED PATCHES"
          echo "========================================"

          echo
          echo "KernelSU patch:"
          echo "${PATCH_KSU:-NOT FOUND}"

          echo
          echo "Kernel patch:"
          echo "${PATCH_KERNEL:-NOT FOUND}"

          # -----------------------------------------------------
          # Validate patches exist
          # -----------------------------------------------------

          if [ -z "$PATCH_KSU" ]; then
            echo
            echo "ERROR: KernelSU SUSFS patch not found."
            echo
            echo "Available KernelSU patches:"
            find susfs/kernel_patches/KernelSU \
              -type f \
              | sort
            exit 1
          fi

          if [ -z "$PATCH_KERNEL" ]; then
            echo
            echo "ERROR: SUSFS 5.10 kernel patch not found."
            echo
            echo "Available patches:"
            find susfs/kernel_patches \
              -type f \
              | sort
            exit 1
          fi

          test -f "$PATCH_KSU"
          test -f "$PATCH_KERNEL"

          # -----------------------------------------------------
          # Show patch headers
          # -----------------------------------------------------

          echo
          echo "========================================"
          echo "KERNELSU PATCH HEADER"
          echo "========================================"

          sed -n '1,80p' "$PATCH_KSU"

          echo
          echo "========================================"
          echo "KERNEL PATCH HEADER"
          echo "========================================"

          sed -n '1,80p' "$PATCH_KERNEL"

          # -----------------------------------------------------
          # Copy SUSFS source files
          # -----------------------------------------------------

          echo
          echo "========================================"
          echo "COPYING SUSFS SOURCE FILES"
          echo "========================================"

          cp "$PATCH_KSU" KernelSU/

          cp -fv \
            susfs/kernel_patches/fs/* \
            fs/

          cp -fv \
            susfs/kernel_patches/include/linux/* \
            include/linux/

          # -----------------------------------------------------
          # Test KernelSU patch BEFORE applying
          # -----------------------------------------------------

          echo
          echo "========================================"
          echo "TESTING KERNELSU PATCH"
          echo "========================================"

          cd KernelSU

          patch \
            --dry-run \
            -p1 \
            < "$(basename "$PATCH_KSU")"

          echo
          echo "KernelSU dry-run PASSED."

          # -----------------------------------------------------
          # Apply KernelSU patch
          # -----------------------------------------------------

          echo
          echo "========================================"
          echo "APPLYING KERNELSU PATCH"
          echo "========================================"

          patch \
            -p1 \
            < "$(basename "$PATCH_KSU")"

          cd ..

          # -----------------------------------------------------
          # Test kernel SUSFS patch
          # -----------------------------------------------------

          echo
          echo "========================================"
          echo "TESTING KERNEL SUSFS PATCH"
          echo "========================================"

          patch \
            --dry-run \
            -p1 \
            < "$PATCH_KERNEL"

          echo
          echo "Kernel SUSFS dry-run PASSED."

          # -----------------------------------------------------
          # Apply kernel SUSFS patch
          # -----------------------------------------------------

          echo
          echo "========================================"
          echo "APPLYING KERNEL SUSFS PATCH"
          echo "========================================"

          patch \
            -p1 \
            < "$PATCH_KERNEL"

          echo
          echo "========================================"
          echo "SUSFS PATCHING COMPLETED"
          echo "========================================"


      # =========================================================
      # CONFIGURE KERNEL
      # =========================================================

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:$PATH"

          echo "========================================"
          echo "CONFIGURING KERNEL"
          echo "========================================"

          # -----------------------------------------------------
          # Wi-Fi framework
          # -----------------------------------------------------

          scripts/config --enable WIRELESS
          scripts/config --enable CFG80211
          scripts/config --enable MAC80211
          scripts/config --enable RFKILL

          # -----------------------------------------------------
          # KernelSU
          # -----------------------------------------------------

          scripts/config --enable KSU

          # -----------------------------------------------------
          # SUSFS
          # -----------------------------------------------------

          scripts/config --enable KSU_SUSFS

          # -----------------------------------------------------
          # ThinLTO
          # -----------------------------------------------------

          scripts/config --enable LTO
          scripts/config --enable LTO_CLANG
          scripts/config --enable LTO_CLANG_THIN
          scripts/config --disable LTO_CLANG_FULL
          scripts/config --disable LTO_NONE

          # -----------------------------------------------------
          # Generate final configuration
          # -----------------------------------------------------

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo
          echo "========================================"
          echo "FINAL CONFIG"
          echo "========================================"

          grep -E \
            '^CONFIG_(WIRELESS|CFG80211|MAC80211|RFKILL|KSU|KSU_SUSFS|LTO|LTO_CLANG|LTO_CLANG_THIN|LTO_CLANG_FULL)=' \
            .config || true

          echo
          echo "========================================"
          echo "VERIFY REQUIRED CONFIG"
          echo "========================================"

          test "$(scripts/config --state WIRELESS)" = "y"
          test "$(scripts/config --state CFG80211)" = "y"
          test "$(scripts/config --state MAC80211)" = "y"
          test "$(scripts/config --state RFKILL)" = "y"

          test "$(scripts/config --state KSU)" = "y"
          test "$(scripts/config --state KSU_SUSFS)" = "y"

          test "$(scripts/config --state LTO)" = "y"
          test "$(scripts/config --state LTO_CLANG)" = "y"
          test "$(scripts/config --state LTO_CLANG_THIN)" = "y"

          if [ "$(scripts/config --state LTO_CLANG_FULL)" = "y" ]; then
            echo
            echo "ERROR: FULL LTO IS ENABLED"
            exit 1
          fi

          echo
          echo "========================================"
          echo "CONFIG CHECK PASSED"
          echo "========================================"


      # =========================================================
      # BUILD
      # =========================================================

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:$PATH"

          echo "========================================"
          echo "BUILDING TEMPLAR KERNEL"
          echo "========================================"

          echo
          echo "===== TOOLCHAIN ====="

          command -v clang
          command -v ld.lld

          clang --version
          ld.lld --version

          echo
          echo "========================================"
          echo "MAKE"
          echo "========================================"

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LTO=thin \
            CROSS_COMPILE= \
            CROSS_COMPILE_COMPAT= \
            -j"$(nproc)" \
            Image

          echo
          echo "========================================"
          echo "BUILD FINISHED"
          echo "========================================"


      # =========================================================
      # VERIFY KERNEL
      # =========================================================

      - name: Verify kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING KERNEL"
          echo "========================================"

          test -f arch/arm64/boot/Image

          echo
          echo "===== FILE ====="

          file arch/arm64/boot/Image

          echo
          echo "===== SIZE ====="

          ls -lh arch/arm64/boot/Image

          echo
          echo "===== KERNEL VERSION ====="

          strings arch/arm64/boot/Image \
            | grep -m1 \
            -E 'Linux version 5\.10\.' \
            || true

          echo
          echo "========================================"
          echo "KERNEL IMAGE VERIFIED"
          echo "========================================"


      # =========================================================
      # ARTIFACT
      # =========================================================

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Templar-5.10-KSU-SUSFS-ThinLTO
          path: arch/arm64/boot/Image
          if-no-files-found: error