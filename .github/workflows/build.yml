name: Build Templar KSU SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout Templar
        uses: actions/checkout@v4
        with:
          ref: Templar-LinuxStable
          fetch-depth: 1


      # =========================================================
      # DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt update

          sudo apt install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            pahole \
            cpio \
            lz4 \
            gzip \
            zip \
            unzip \
            rsync \
            git \
            curl \
            wget \
            python3 \
            ca-certificates \
            file


      # =========================================================
      # LLVM 22
      # =========================================================

      - name: Install LLVM 22
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALLING LLVM 22"
          echo "========================================"

          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh

          sudo ./llvm.sh 22

          # llvm.sh installs the versioned binaries.
          # Put LLVM 22 FIRST for this step.
          export PATH="/usr/lib/llvm-22/bin:$PATH"

          # Also expose it to every following GitHub Actions step.
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

          echo
          echo "===== LLVM VERSION ====="

          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy
          command -v llvm-strip

          echo
          clang --version
          echo
          ld.lld --version
          echo
          llvm-ar --version | head -n 1
          llvm-nm --version | head -n 1

          echo
          echo "LLVM 22 CHECK PASSED."


      # =========================================================
      # KERNELSU
      # =========================================================

      - name: Install KernelSU
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALLING KERNELSU"
          echo "========================================"

          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -

          echo
          echo "===== KERNELSU STATUS ====="

          test -d KernelSU

          echo
          echo "KernelSU HEAD:"
          git -C KernelSU log -1 --oneline

          echo
          echo "KernelSU VERSION:"
          git -C KernelSU describe --tags --always || true

          echo
          echo "KernelSU installed."


      # =========================================================
      # CLONE SUSFS
      # =========================================================

      - name: Clone SUSFS
        shell: bash
        run: |
          set -euo pipefail

          SUSFS_BRANCH="gki-android12-5.10"

          echo "========================================"
          echo "CLONING SUSFS"
          echo "========================================"

          echo "Branch: $SUSFS_BRANCH"

          git clone \
            --depth=1 \
            --branch "$SUSFS_BRANCH" \
            https://github.com/deepongi-labs/susfs4ksu.git \
            susfs

          echo
          echo "===== SUSFS COMMIT ====="
          git -C susfs log -1 --oneline

          echo
          echo "===== SUSFS BRANCH ====="
          git -C susfs branch --show-current

          echo
          echo "===== SUSFS FILES ====="

          find susfs/kernel_patches \
            -type f \
            | sort


      # =========================================================
      # APPLY SUSFS
      # =========================================================

      - name: Apply SUSFS
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PREPARING SUSFS"
          echo "========================================"

          echo
          echo "===== PATCH FILES ====="

          find susfs/kernel_patches \
            -type f \
            | sort

          # -----------------------------------------------------
          # Find KernelSU patch
          # -----------------------------------------------------

          PATCH_KSU="$(
            find susfs/kernel_patches/KernelSU \
              -type f \
              -name '10_enable_susfs_for_ksu.patch' \
              | sort \
              | head -n 1
          )"

          # -----------------------------------------------------
          # Find kernel 5.10 patch
          # -----------------------------------------------------

          PATCH_KERNEL="$(
            find susfs/kernel_patches \
              -type f \
              \( \
                -name '50_add_susfs_in_kernel-5.10*.patch' \
                -o \
                -name '*5.10*.patch' \
              \) \
              | sort \
              | head -n 1
          )"

          echo
          echo "========================================"
          echo "SELECTED PATCHES"
          echo "========================================"

          echo
          echo "KernelSU patch:"
          echo "${PATCH_KSU:-NOT FOUND}"

          echo
          echo "Kernel patch:"
          echo "${PATCH_KERNEL:-NOT FOUND}"

          # -----------------------------------------------------
          # Validate
          # -----------------------------------------------------

          if [ -z "$PATCH_KSU" ]; then
            echo
            echo "ERROR: SUSFS KernelSU patch not found."
            exit 1
          fi

          if [ -z "$PATCH_KERNEL" ]; then
            echo
            echo "ERROR: SUSFS 5.10 kernel patch not found."
            exit 1
          fi

          # -----------------------------------------------------
          # Check patch paths
          # -----------------------------------------------------

          test -f "$PATCH_KSU"
          test -f "$PATCH_KERNEL"

          echo
          echo "========================================"
          echo "COPYING SUSFS SOURCES"
          echo "========================================"

          cp "$PATCH_KSU" KernelSU/

          cp -fv \
            susfs/kernel_patches/fs/* \
            fs/

          cp -fv \
            susfs/kernel_patches/include/linux/* \
            include/linux/

          echo
          echo "========================================"
          echo "PATCHING KERNELSU"
          echo "========================================"

          cd KernelSU

          patch \
            --forward \
            --batch \
            -p1 \
            < "$(basename "$PATCH_KSU")"

          cd ..

          echo
          echo "========================================"
          echo "PATCHING KERNEL"
          echo "========================================"

          patch \
            --forward \
            --batch \
            -p1 \
            < "$PATCH_KERNEL"

          echo
          echo "========================================"
          echo "SUSFS PATCH SUCCESS"
          echo "========================================"


      # =========================================================
      # CONFIGURE KERNEL
      # =========================================================

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:$PATH"

          echo "========================================"
          echo "CONFIGURING KERNEL"
          echo "========================================"

          # -----------------------------------------------------
          # Wi-Fi framework
          # -----------------------------------------------------

          scripts/config --enable WIRELESS
          scripts/config --enable CFG80211
          scripts/config --enable MAC80211
          scripts/config --enable RFKILL

          # -----------------------------------------------------
          # KernelSU
          # -----------------------------------------------------

          scripts/config --enable KSU

          # -----------------------------------------------------
          # SUSFS
          # -----------------------------------------------------

          scripts/config --enable KSU_SUSFS

          # -----------------------------------------------------
          # ThinLTO
          # -----------------------------------------------------

          scripts/config --enable LTO
          scripts/config --enable LTO_CLANG
          scripts/config --enable LTO_CLANG_THIN
          scripts/config --disable LTO_CLANG_FULL
          scripts/config --disable LTO_NONE

          # -----------------------------------------------------
          # Generate config
          # -----------------------------------------------------

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo
          echo "========================================"
          echo "FINAL CONFIG"
          echo "========================================"

          grep -E \
            '^CONFIG_(WIRELESS|CFG80211|MAC80211|RFKILL|KSU|KSU_SUSFS|LTO|LTO_CLANG|LTO_CLANG_THIN|LTO_CLANG_FULL)=' \
            .config || true

          echo
          echo "========================================"
          echo "VERIFY CONFIG"
          echo "========================================"

          test "$(scripts/config --state WIRELESS)" = "y"
          test "$(scripts/config --state CFG80211)" = "y"
          test "$(scripts/config --state MAC80211)" = "y"
          test "$(scripts/config --state RFKILL)" = "y"

          test "$(scripts/config --state KSU)" = "y"
          test "$(scripts/config --state KSU_SUSFS)" = "y"

          test "$(scripts/config --state LTO)" = "y"
          test "$(scripts/config --state LTO_CLANG)" = "y"
          test "$(scripts/config --state LTO_CLANG_THIN)" = "y"

          if [ "$(scripts/config --state LTO_CLANG_FULL)" = "y" ]; then
            echo "ERROR: Full LTO is enabled."
            exit 1
          fi

          echo
          echo "CONFIG CHECK PASSED."


      # =========================================================
      # BUILD
      # =========================================================

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:$PATH"

          echo "========================================"
          echo "BUILDING TEMPLAR"
          echo "========================================"

          echo
          echo "===== TOOLCHAIN ====="
          clang --version
          ld.lld --version

          echo
          echo "===== BUILD ====="

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LTO=thin \
            CROSS_COMPILE= \
            CROSS_COMPILE_COMPAT= \
            -j"$(nproc)" \
            Image

          echo
          echo "========================================"
          echo "BUILD FINISHED"
          echo "========================================"


      # =========================================================
      # VERIFY
      # =========================================================

      - name: Verify kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING KERNEL"
          echo "========================================"

          test -f arch/arm64/boot/Image

          echo
          echo "===== FILE ====="

          file arch/arm64/boot/Image

          echo
          echo "===== SIZE ====="

          ls -lh arch/arm64/boot/Image

          echo
          echo "===== KERNEL VERSION ====="

          strings arch/arm64/boot/Image \
            | grep -m1 \
            -E 'Linux version 5\.10\.' \
            || true

          echo
          echo "KERNEL IMAGE VERIFIED."


      # =========================================================
      # ARTIFACT
      # =========================================================

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Templar-5.10-KSU-SUSFS-ThinLTO
          path: arch/arm64/boot/Image
          if-no-files-found: error