name: Build Templar KernelSU Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Templar KSUN
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      LLVM_PATH: /usr/lib/llvm-22/bin

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Templar
        uses: actions/checkout@v4
        with:
          ref: Templar-LinuxStable
          fetch-depth: 0
          submodules: recursive

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            gcc \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            pahole \
            perl \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # LLVM 22
      # ============================================================

      - name: Install LLVM 22
        shell: bash
        run: |
          set -euo pipefail

          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 22

          sudo apt-get install -y \
            clang-22 \
            lld-22 \
            llvm-22 \
            llvm-22-dev \
            llvm-22-tools

          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

          export PATH="/usr/lib/llvm-22/bin:${PATH}"

          echo "========================================"
          echo "TOOLCHAIN"
          echo "========================================"

          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy
          command -v llvm-strip

          clang --version
          ld.lld --version

      # ============================================================
      # KERNEL INFO
      # ============================================================

      - name: Kernel Information
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "KERNEL INFORMATION"
          echo "========================================"

          git rev-parse HEAD
          git log -1 --oneline

          echo
          grep -E \
            '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' \
            Makefile

      # ============================================================
      # KERNELSU NEXT
      # ============================================================

      - name: Install KernelSU Next
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:${PATH}"

          echo "========================================"
          echo "KERNELSU NEXT"
          echo "========================================"

          curl --fail --location --proto '=https' -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s next

          echo
          echo "KSU NEXT COMMIT:"
          git -C KernelSU-Next rev-parse HEAD

          echo
          git -C KernelSU-Next log -1 --oneline

      # ============================================================
      # VERIFY KERNELSU
      # ============================================================

      - name: Verify KernelSU Next
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFY KERNELSU"
          echo "========================================"

          if [ ! -e drivers/kernelsu ]; then
            echo "ERROR: drivers/kernelsu not found"
            exit 1
          fi

          ls -la drivers/kernelsu

          echo
          echo "KernelSU path:"
          readlink -f drivers/kernelsu

      # ============================================================
      # DEFCONFIG
      # ============================================================

      - name: Generate Defconfig
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:${PATH}"

          echo "========================================"
          echo "GENERATING DEFCONFIG"
          echo "========================================"

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            defconfig

      # ============================================================
      # KERNEL CONFIG
      # ============================================================

      - name: Configure Kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:${PATH}"

          echo "========================================"
          echo "CONFIGURING KERNEL"
          echo "========================================"

          # --------------------------------------------------------
          # KERNELSU
          # --------------------------------------------------------

          ./scripts/config --enable CONFIG_KSU

          # --------------------------------------------------------
          # THINLTO
          # --------------------------------------------------------

          ./scripts/config --enable CONFIG_LTO
          ./scripts/config --enable CONFIG_LTO_CLANG
          ./scripts/config --disable CONFIG_LTO_CLANG_FULL
          ./scripts/config --enable CONFIG_LTO_CLANG_THIN

          # --------------------------------------------------------
          # WIRELESS
          # --------------------------------------------------------

          ./scripts/config --enable CONFIG_WIRELESS
          ./scripts/config --enable CONFIG_CFG80211
          ./scripts/config --enable CONFIG_MAC80211
          ./scripts/config --enable CONFIG_RFKILL

          # --------------------------------------------------------
          # DO NOT FORCE KPROBES
          #
          # Keep the configuration close to the working
          # Templar configuration first.
          # --------------------------------------------------------

          ./scripts/config --disable CONFIG_KPROBES || true
          ./scripts/config --disable CONFIG_KPROBE_EVENTS || true

          # --------------------------------------------------------
          # NO SUSFS
          # --------------------------------------------------------

          ./scripts/config --disable CONFIG_KSU_SUSFS || true
          ./scripts/config --disable CONFIG_KSU_SUSFS_SUS_PATH || true
          ./scripts/config --disable CONFIG_KSU_SUSFS_SUS_MOUNT || true
          ./scripts/config --disable CONFIG_KSU_SUSFS_SUS_KSTAT || true
          ./scripts/config --disable CONFIG_KSU_SUSFS_SPOOF_UNAME || true
          ./scripts/config --disable CONFIG_KSU_SUSFS_ENABLE_LOG || true
          ./scripts/config --disable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS || true
          ./scripts/config --disable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG || true
          ./scripts/config --disable CONFIG_KSU_SUSFS_SUS_MAP || true
          ./scripts/config --disable CONFIG_KSU_SUSFS_OPEN_REDIRECT || true

          # --------------------------------------------------------
          # FINALIZE
          # --------------------------------------------------------

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      # ============================================================
      # SHOW CONFIG
      # ============================================================

      - name: Show Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "KERNELSU"
          echo "========================================"

          grep '^CONFIG_KSU=' .config || true

          echo
          echo "========================================"
          echo "LTO"
          echo "========================================"

          grep -E \
            '^CONFIG_(LTO|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN)=' \
            .config || true

          echo
          echo "========================================"
          echo "WIRELESS"
          echo "========================================"

          grep -E \
            '^CONFIG_(WIRELESS|CFG80211|MAC80211|RFKILL)=' \
            .config || true

          echo
          echo "========================================"
          echo "SUSFS"
          echo "========================================"

          grep '^CONFIG_KSU_SUSFS' .config || \
            echo "SUSFS: DISABLED"

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:${PATH}"

          echo "========================================"
          echo "BUILDING TEMPLAR KERNEL"
          echo "========================================"

          clang --version | head -n 1
          ld.lld --version | head -n 1

          echo
          echo "Starting build..."

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LTO=thin \
            CROSS_COMPILE= \
            CROSS_COMPILE_COMPAT= \
            -j2 \
            Image

      # ============================================================
      # VERIFY IMAGE
      # ============================================================

      - name: Verify Image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="arch/arm64/boot/Image"

          echo "========================================"
          echo "VERIFY IMAGE"
          echo "========================================"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Image not found"
            exit 1
          fi

          ls -lh "$IMAGE"

          echo
          file "$IMAGE"

          echo
          echo "Kernel version:"
          strings "$IMAGE" | grep -m1 "Linux version" || true

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Prepare Artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          cp \
            arch/arm64/boot/Image \
            output/Image

          cp \
            .config \
            output/kernel.config

          [ ! -f System.map ] || cp System.map output/System.map
          [ ! -f Module.symvers ] || cp Module.symvers output/Module.symvers

          echo "========================================"
          echo "OUTPUT"
          echo "========================================"

          ls -lah output

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Templar-KernelSU-Next-5.10.269
          path: output/
          if-no-files-found: error
          retention-days: 14
