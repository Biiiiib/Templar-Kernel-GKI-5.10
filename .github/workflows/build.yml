name: Build Templar KernelSU Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Templar KSUN Dev
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      LLVM_PATH: /usr/lib/llvm-22/bin

    steps:

      # ============================================================
      # CHECKOUT TEMPLAR
      # ============================================================

      - name: Checkout Templar Kernel
        uses: actions/checkout@v4
        with:
          ref: Templar-LinuxStable
          fetch-depth: 0
          submodules: recursive

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            gcc \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            pahole \
            perl \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # LLVM 22
      # ============================================================

      - name: Install LLVM 22
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALLING LLVM 22"
          echo "========================================"

          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 22

          sudo apt-get install -y \
            clang-22 \
            lld-22 \
            llvm-22 \
            llvm-22-dev \
            llvm-22-tools

          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

          export PATH="/usr/lib/llvm-22/bin:${PATH}"

          echo
          echo "========================================"
          echo "LLVM TOOLCHAIN"
          echo "========================================"

          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy
          command -v llvm-strip

          echo
          clang --version

          echo
          ld.lld --version

      # ============================================================
      # KERNEL INFORMATION
      # ============================================================

      - name: Kernel Information
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "KERNEL INFORMATION"
          echo "========================================"

          echo
          echo "Git commit:"
          git rev-parse HEAD

          echo
          echo "Git:"
          git log -1 --oneline

          echo
          echo "Kernel version:"
          grep -E \
            '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' \
            Makefile

          echo
          echo "Available GKI configs:"
          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -iname '*gki*' \
            -print | sort

      # ============================================================
      # KERNELSU NEXT DEV
      # ============================================================

      - name: Install KernelSU Next Dev
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:${PATH}"

          echo "========================================"
          echo "INSTALLING KERNELSU NEXT DEV"
          echo "========================================"

          curl --fail --location --proto '=https' -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s dev

          echo
          echo "========================================"
          echo "KERNELSU NEXT INFORMATION"
          echo "========================================"

          if [ ! -d "KernelSU-Next" ]; then
            echo "ERROR: KernelSU-Next directory not found"
            exit 1
          fi

          echo
          echo "Commit:"
          git -C KernelSU-Next rev-parse HEAD

          echo
          echo "Commit message:"
          git -C KernelSU-Next log -1 --oneline

          echo
          echo "Branch:"
          git -C KernelSU-Next branch --show-current || true

          echo
          echo "Describe:"
          git -C KernelSU-Next describe --tags --always || true

      # ============================================================
      # VERIFY KERNELSU
      # ============================================================

      - name: Verify KernelSU Next
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING KERNELSU NEXT"
          echo "========================================"

          if [ ! -e "drivers/kernelsu" ]; then
            echo "ERROR: drivers/kernelsu not found"
            exit 1
          fi

          echo
          echo "drivers/kernelsu:"
          ls -la drivers/kernelsu

          echo
          echo "Resolved path:"
          readlink -f drivers/kernelsu

          echo
          echo "KernelSU source:"
          ls -la KernelSU-Next/kernel | head -40

      # ============================================================
      # GKI DEFCONFIG
      # ============================================================

      - name: Generate GKI Defconfig
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:${PATH}"

          echo "========================================"
          echo "GENERATING GKI DEFCONFIG"
          echo "========================================"

          if make ARCH=arm64 help 2>/dev/null | grep -qE 'gki_defconfig'; then
            echo "Using gki_defconfig"

            make \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              gki_defconfig

          elif [ -f arch/arm64/configs/gki_defconfig ]; then
            echo "Using gki_defconfig from arch/arm64/configs"

            make \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              gki_defconfig

          else
            echo "ERROR: gki_defconfig was not found."
            echo
            echo "Available configs:"
            find arch/arm64/configs \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' | sort | grep -i gki || true
            exit 1
          fi

      # ============================================================
      # CONFIGURE KERNEL
      # ============================================================

      - name: Configure Kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:${PATH}"

          echo "========================================"
          echo "CONFIGURING TEMPLAR"
          echo "========================================"

          # --------------------------------------------------------
          # KERNELSU
          # --------------------------------------------------------

          echo
          echo "Enabling KernelSU..."

          ./scripts/config --enable CONFIG_KSU

          # --------------------------------------------------------
          # NO SUSFS
          # --------------------------------------------------------

          echo
          echo "Disabling SUSFS..."

          ./scripts/config --disable CONFIG_KSU_SUSFS || true
          ./scripts/config --disable CONFIG_KSU_SUSFS_SUS_PATH || true
          ./scripts/config --disable CONFIG_KSU_SUSFS_SUS_MOUNT || true
          ./scripts/config --disable CONFIG_KSU_SUSFS_SUS_KSTAT || true
          ./scripts/config --disable CONFIG_KSU_SUSFS_SPOOF_UNAME || true
          ./scripts/config --disable CONFIG_KSU_SUSFS_ENABLE_LOG || true
          ./scripts/config --disable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS || true
          ./scripts/config --disable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG || true
          ./scripts/config --disable CONFIG_KSU_SUSFS_SUS_MAP || true
          ./scripts/config --disable CONFIG_KSU_SUSFS_OPEN_REDIRECT || true

          # --------------------------------------------------------
          # THINLTO
          # --------------------------------------------------------

          echo
          echo "Configuring ThinLTO..."

          ./scripts/config --enable CONFIG_LTO
          ./scripts/config --enable CONFIG_LTO_CLANG
          ./scripts/config --disable CONFIG_LTO_CLANG_FULL
          ./scripts/config --enable CONFIG_LTO_CLANG_THIN

          # --------------------------------------------------------
          # WIRELESS
          # --------------------------------------------------------

          echo
          echo "Configuring Wireless..."

          ./scripts/config --enable CONFIG_WIRELESS
          ./scripts/config --enable CONFIG_CFG80211
          ./scripts/config --enable CONFIG_MAC80211
          ./scripts/config --enable CONFIG_RFKILL

          # --------------------------------------------------------
          # KPROBES
          #
          # Do not force these for the baseline build.
          # --------------------------------------------------------

          ./scripts/config --disable CONFIG_KPROBES || true
          ./scripts/config --disable CONFIG_KPROBE_EVENTS || true

          # --------------------------------------------------------
          # FINALIZE
          # --------------------------------------------------------

          echo
          echo "Running olddefconfig..."

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      # ============================================================
      # SHOW FINAL CONFIG
      # ============================================================

      - name: Show Final Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FINAL CONFIGURATION"
          echo "========================================"

          echo
          echo "========== KERNELSU =========="

          grep -E \
            '^CONFIG_KSU=' \
            .config || true

          echo
          echo "========== LTO =========="

          grep -E \
            '^CONFIG_(LTO|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN)=' \
            .config || true

          echo
          echo "========== WIRELESS =========="

          grep -E \
            '^CONFIG_(WIRELESS|CFG80211|MAC80211|RFKILL)=' \
            .config || true

          echo
          echo "========== KPROBES =========="

          grep -E \
            '^CONFIG_(KPROBES|KPROBE_EVENTS)=' \
            .config || true

          echo
          echo "========== SUSFS =========="

          if grep -q '^CONFIG_KSU_SUSFS=' .config; then
            echo "WARNING: SUSFS CONFIG FOUND"
            grep '^CONFIG_KSU_SUSFS' .config
          else
            echo "SUSFS: DISABLED"
          fi

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:${PATH}"

          echo "========================================"
          echo "BUILDING TEMPLAR KERNEL"
          echo "========================================"

          echo
          echo "Compiler:"
          clang --version | head -n 1

          echo
          echo "Linker:"
          ld.lld --version | head -n 1

          echo
          echo "CPU:"
          nproc

          echo
          echo "Kernel:"
          grep -E \
            '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' \
            Makefile

          echo
          echo "========================================"
          echo "MAKE IMAGE"
          echo "========================================"

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE= \
            CROSS_COMPILE_COMPAT= \
            -j2 \
            Image

      # ============================================================
      # VERIFY IMAGE
      # ============================================================

      - name: Verify Kernel Image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="arch/arm64/boot/Image"

          echo "========================================"
          echo "VERIFYING IMAGE"
          echo "========================================"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Kernel Image not found"
            exit 1
          fi

          echo
          echo "Image:"
          ls -lh "$IMAGE"

          echo
          echo "File:"
          file "$IMAGE"

          echo
          echo "Kernel version:"
          strings "$IMAGE" | grep -m1 "Linux version" || true

      # ============================================================
      # FINAL VERIFICATION
      # ============================================================

      - name: Final Verification
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FINAL VERIFICATION"
          echo "========================================"

          echo
          echo "KERNELSU:"
          grep '^CONFIG_KSU=' .config || true

          echo
          echo "LTO:"
          grep -E \
            '^CONFIG_(LTO|LTO_CLANG|LTO_CLANG_FULL|LTO_CLANG_THIN)=' \
            .config || true

          echo
          echo "WIRELESS:"
          grep -E \
            '^CONFIG_(WIRELESS|CFG80211|MAC80211|RFKILL)=' \
            .config || true

          echo
          echo "SUSFS:"
          grep '^CONFIG_KSU_SUSFS' .config || \
            echo "SUSFS: DISABLED"

          echo
          echo "IMAGE:"
          ls -lh arch/arm64/boot/Image

          echo
          echo "========================================"
          echo "BUILD VERIFICATION COMPLETE"
          echo "========================================"

      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================

      - name: Prepare Artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          cp \
            arch/arm64/boot/Image \
            output/Image

          cp \
            .config \
            output/kernel.config

          if [ -f System.map ]; then
            cp System.map output/System.map
          fi

          if [ -f Module.symvers ]; then
            cp Module.symvers output/Module.symvers
          fi

          echo "========================================"
          echo "OUTPUT FILES"
          echo "========================================"

          ls -lah output

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Templar-KernelSU-Next-dev-5.10.269
          path: output/
          if-no-files-found: error
          retention-days: 14
