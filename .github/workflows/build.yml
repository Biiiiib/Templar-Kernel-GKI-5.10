name: Build Templar KSU SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # CHECKOUT TEMPLAR
      # =========================================================

      - name: Checkout Templar
        uses: actions/checkout@v4
        with:
          ref: Templar-LinuxStable
          fetch-depth: 1


      # =========================================================
      # DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt update

          sudo apt install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            pahole \
            cpio \
            lz4 \
            gzip \
            zip \
            unzip \
            rsync \
            git \
            curl \
            wget \
            python3 \
            ca-certificates \
            file \
            perl


      # =========================================================
      # LLVM 22
      # =========================================================

      - name: Install LLVM 22
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALLING LLVM 22"
          echo "========================================"

          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh

          sudo ./llvm.sh 22

          export PATH="/usr/lib/llvm-22/bin:$PATH"

          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

          echo
          echo "========================================"
          echo "LLVM TOOLCHAIN"
          echo "========================================"

          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy
          command -v llvm-strip

          echo
          clang --version

          echo
          ld.lld --version

          echo
          llvm-ar --version | head -n 1

          echo
          llvm-nm --version | head -n 1

          echo
          llvm-objcopy --version | head -n 1

          echo
          llvm-strip --version | head -n 1

          echo
          echo "LLVM 22 CHECK PASSED."


      # =========================================================
      # KERNELSU
      # =========================================================

      - name: Install KernelSU v3.3.0
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALLING KERNELSU"
          echo "========================================"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -

          cd KernelSU

          git fetch --tags --force

          git checkout --detach v3.3.0

          cd ..

          echo
          echo "========================================"
          echo "KERNELSU INFORMATION"
          echo "========================================"

          echo "TAG:"
          git -C KernelSU describe --tags --always

          echo
          echo "COMMIT:"
          git -C KernelSU rev-parse HEAD

          echo
          echo "HEAD:"
          git -C KernelSU log -1 --oneline

          echo
          echo "KernelSU v3.3.0 ready."


      # =========================================================
      # CLONE OFFICIAL SUSFS
      # =========================================================

      - name: Setup SUSFS
        shell: bash
        run: |
          set -euo pipefail

          SUSFS_BRANCH="gki-android12-5.10"
          SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"

          echo "========================================"
          echo "CLONING OFFICIAL SUSFS"
          echo "========================================"

          echo "Repository:"
          echo "$SUSFS_REPO"

          echo
          echo "Branch:"
          echo "$SUSFS_BRANCH"

          git clone \
            --depth=1 \
            --branch "$SUSFS_BRANCH" \
            "$SUSFS_REPO" \
            susfs4ksu

          echo
          echo "========================================"
          echo "SUSFS INFORMATION"
          echo "========================================"

          echo
          echo "COMMIT:"
          git -C susfs4ksu rev-parse HEAD

          echo
          echo "HEAD:"
          git -C susfs4ksu log -1 --oneline

          echo
          echo "BRANCH:"
          git -C susfs4ksu branch --show-current

          echo
          echo "========================================"
          echo "SUSFS PATCHES"
          echo "========================================"

          find susfs4ksu/kernel_patches \
            -type f \
            | sort


      # =========================================================
      # VERIFY SUSFS FILES
      # =========================================================

      - name: Verify SUSFS files
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING SUSFS FILES"
          echo "========================================"

          KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch"

          test -f "$KSU_PATCH"
          test -f "$KERNEL_PATCH"

          echo
          echo "KernelSU patch:"
          echo "$KSU_PATCH"

          echo
          echo "Kernel patch:"
          echo "$KERNEL_PATCH"

          echo
          echo "Required SUSFS files exist."


      # =========================================================
      # COPY SUSFS SOURCES
      # =========================================================

      - name: Copy SUSFS sources
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "COPYING SUSFS SOURCES"
          echo "========================================"

          # Kernel SUSFS source
          cp -fv \
            susfs4ksu/kernel_patches/fs/* \
            fs/

          cp -fv \
            susfs4ksu/kernel_patches/include/linux/* \
            include/linux/

          # KernelSU SUSFS patch
          cp -fv \
            susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            KernelSU/

          echo
          echo "SUSFS sources copied."


      # =========================================================
      # TEST KERNELSU PATCH
      # =========================================================

      - name: Test KernelSU SUSFS patch
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "TESTING KERNELSU SUSFS PATCH"
          echo "========================================"

          cd KernelSU

          patch \
            --batch \
            --dry-run \
            -p1 \
            < 10_enable_susfs_for_ksu.patch

          cd ..

          echo
          echo "KernelSU SUSFS dry-run PASSED."


      # =========================================================
      # APPLY KERNELSU SUSFS PATCH
      # =========================================================

      - name: Apply KernelSU SUSFS patch
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "APPLYING KERNELSU SUSFS PATCH"
          echo "========================================"

          cd KernelSU

          patch \
            --batch \
            -p1 \
            < 10_enable_susfs_for_ksu.patch

          cd ..

          echo
          echo "KernelSU SUSFS patch applied successfully."


      # =========================================================
      # TEST KERNEL SUSFS PATCH
      # =========================================================

      - name: Test kernel SUSFS patch
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "TESTING KERNEL SUSFS PATCH"
          echo "========================================"

          patch \
            --batch \
            --dry-run \
            -p1 \
            < susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          echo
          echo "Kernel SUSFS dry-run PASSED."


      # =========================================================
      # APPLY KERNEL SUSFS PATCH
      # =========================================================

      - name: Apply kernel SUSFS patch
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "APPLYING KERNEL SUSFS PATCH"
          echo "========================================"

          patch \
            --batch \
            -p1 \
            < susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          echo
          echo "Kernel SUSFS patch applied successfully."


      # =========================================================
      # CONFIGURE KERNEL
      # =========================================================

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:$PATH"

          echo "========================================"
          echo "CONFIGURING KERNEL"
          echo "========================================"

          # -----------------------------------------------------
          # Wi-Fi
          # -----------------------------------------------------

          scripts/config --enable WIRELESS
          scripts/config --enable CFG80211
          scripts/config --enable MAC80211
          scripts/config --enable RFKILL

          # -----------------------------------------------------
          # KernelSU
          # -----------------------------------------------------

          scripts/config --enable KSU

          # -----------------------------------------------------
          # SUSFS
          # -----------------------------------------------------

          scripts/config --enable KSU_SUSFS
          scripts/config --enable KSU_SUSFS_SUS_PATH
          scripts/config --enable KSU_SUSFS_SUS_MOUNT
          scripts/config --enable KSU_SUSFS_SUS_KSTAT
          scripts/config --enable KSU_SUSFS_SPOOF_UNAME
          scripts/config --enable KSU_SUSFS_ENABLE_LOG
          scripts/config --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          scripts/config --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          scripts/config --enable KSU_SUSFS_SUS_MAP
          scripts/config --enable KSU_SUSFS_OPEN_REDIRECT

          # -----------------------------------------------------
          # ThinLTO
          # -----------------------------------------------------

          scripts/config --enable LTO
          scripts/config --enable LTO_CLANG
          scripts/config --enable LTO_CLANG_THIN

          scripts/config --disable LTO_CLANG_FULL
          scripts/config --disable LTO_NONE

          # -----------------------------------------------------
          # Generate final config
          # -----------------------------------------------------

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo
          echo "========================================"
          echo "FINAL CONFIG"
          echo "========================================"

          grep -E \
            '^CONFIG_(WIRELESS|CFG80211|MAC80211|RFKILL|KSU|KSU_SUSFS|KSU_SUSFS_|LTO|LTO_CLANG|LTO_CLANG_THIN|LTO_CLANG_FULL)=' \
            .config || true

          echo
          echo "========================================"
          echo "VERIFY REQUIRED CONFIG"
          echo "========================================"

          test "$(scripts/config --state WIRELESS)" = "y"
          test "$(scripts/config --state CFG80211)" = "y"
          test "$(scripts/config --state MAC80211)" = "y"
          test "$(scripts/config --state RFKILL)" = "y"

          test "$(scripts/config --state KSU)" = "y"
          test "$(scripts/config --state KSU_SUSFS)" = "y"

          test "$(scripts/config --state KSU_SUSFS_SUS_PATH)" = "y"
          test "$(scripts/config --state KSU_SUSFS_SUS_MOUNT)" = "y"
          test "$(scripts/config --state KSU_SUSFS_SUS_KSTAT)" = "y"
          test "$(scripts/config --state KSU_SUSFS_SPOOF_UNAME)" = "y"
          test "$(scripts/config --state KSU_SUSFS_ENABLE_LOG)" = "y"
          test "$(scripts/config --state KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS)" = "y"
          test "$(scripts/config --state KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG)" = "y"
          test "$(scripts/config --state KSU_SUSFS_SUS_MAP)" = "y"
          test "$(scripts/config --state KSU_SUSFS_OPEN_REDIRECT)" = "y"

          test "$(scripts/config --state LTO)" = "y"
          test "$(scripts/config --state LTO_CLANG)" = "y"
          test "$(scripts/config --state LTO_CLANG_THIN)" = "y"

          if [ "$(scripts/config --state LTO_CLANG_FULL)" = "y" ]; then
            echo "ERROR: Full LTO is enabled."
            exit 1
          fi

          echo
          echo "CONFIG CHECK PASSED."


      # =========================================================
      # BUILD
      # =========================================================

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:$PATH"

          echo "========================================"
          echo "BUILDING TEMPLAR"
          echo "========================================"

          echo
          echo "===== TOOLCHAIN ====="

          command -v clang
          command -v ld.lld

          clang --version
          ld.lld --version

          echo
          echo "========================================"
          echo "MAKE"
          echo "========================================"

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LTO=thin \
            CROSS_COMPILE= \
            CROSS_COMPILE_COMPAT= \
            -j"$(nproc)" \
            Image

          echo
          echo "========================================"
          echo "BUILD FINISHED"
          echo "========================================"


      # =========================================================
      # VERIFY
      # =========================================================

      - name: Verify kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING KERNEL"
          echo "========================================"

          test -f arch/arm64/boot/Image

          echo
          echo "===== FILE ====="

          file arch/arm64/boot/Image

          echo
          echo "===== SIZE ====="

          ls -lh arch/arm64/boot/Image

          echo
          echo "===== KERNEL VERSION ====="

          strings arch/arm64/boot/Image \
            | grep -m1 \
            -E 'Linux version 5\.10\.' \
            || true

          echo
          echo "KERNEL IMAGE VERIFIED."


      # =========================================================
      # ARTIFACT
      # =========================================================

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Templar-5.10-KSU-SUSFS-ThinLTO
          path: arch/arm64/boot/Image
          if-no-files-found: error
