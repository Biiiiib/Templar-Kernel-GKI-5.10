name: Build Templar KernelSU Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Templar KSUN
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      KERNEL_BRANCH: Templar-LinuxStable
      LLVM_VER: 22

    steps:

      # ============================================================
      # CHECKOUT KERNEL
      # ============================================================

      - name: Checkout Templar Kernel
        uses: actions/checkout@v4
        with:
          ref: Templar-LinuxStable
          fetch-depth: 0
          submodules: recursive

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            gcc \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            pahole \
            perl \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # LLVM 22 SETUP
      # ============================================================

      - name: Install LLVM 22
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALLING LLVM 22"
          echo "========================================"

          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 22

          sudo apt-get install -y \
            clang-22 \
            lld-22 \
            llvm-22 \
            llvm-22-dev \
            llvm-22-tools

          # Setup direktori bin dan symlink default agar make LLVM=1 tidak bingung
          sudo mkdir -p /usr/lib/llvm-22/bin
          for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            if [ -f "/usr/bin/${tool}-22" ]; then
              sudo ln -sf "/usr/bin/${tool}-22" "/usr/lib/llvm-22/bin/${tool}"
            fi
          done

          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/llvm-22/bin:${PATH}"

          echo
          echo "========================================"
          echo "LLVM 22 VERIFICATION"
          echo "========================================"

          /usr/lib/llvm-22/bin/clang --version
          /usr/lib/llvm-22/bin/ld.lld --version

      # ============================================================
      # KERNEL INFORMATION
      # ============================================================

      - name: Kernel Information
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "KERNEL INFORMATION"
          echo "========================================"

          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Commit Log:"
          git log -1 --oneline

          echo
          echo "Kernel version:"
          grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' Makefile

      # ============================================================
      # INSTALL KERNELSU NEXT
      # ============================================================

      - name: Install KernelSU Next
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:${PATH}"

          echo "========================================"
          echo "INSTALLING KERNELSU NEXT"
          echo "========================================"

          curl --fail --location --proto '=https' -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s next

          echo
          echo "========================================"
          echo "KERNELSU NEXT INFORMATION"
          echo "========================================"

          if [ ! -d "KernelSU-Next" ]; then
            echo "ERROR: KernelSU-Next directory not found"
            exit 1
          fi

          echo "KSU Next commit:"
          git -C KernelSU-Next rev-parse HEAD

          echo
          echo "KSU Next log:"
          git -C KernelSU-Next log -1 --oneline

          echo
          echo "KSU Next tag:"
          git -C KernelSU-Next describe --tags --always || true

      # ============================================================
      # VERIFY KSU INTEGRATION
      # ============================================================

      - name: Verify KernelSU Next Integration
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING KERNELSU NEXT"
          echo "========================================"

          if [ ! -e "drivers/kernelsu" ]; then
            echo "ERROR: drivers/kernelsu does not exist"
            exit 1
          fi

          echo "drivers/kernelsu contents:"
          ls -la drivers/kernelsu

          echo
          echo "KernelSU source path:"
          readlink -f drivers/kernelsu || true

      # ============================================================
      # OPTIONAL SUSFS
      # ============================================================

      - name: Try SUSFS
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "OPTIONAL SUSFS"
          echo "========================================"

          SUSFS_ENABLED=false
          rm -rf susfs4ksu

          echo
          echo "========================================"
          echo "CLONING OFFICIAL SUSFS"
          echo "========================================"

          if ! git clone \
            --depth=1 \
            --branch gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs4ksu; then

            echo "WARNING: SUSFS clone failed. Skipping SUSFS."
            echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "SUSFS commit:"
          git -C susfs4ksu rev-parse HEAD

          KSU_PATCH="${GITHUB_WORKSPACE}/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          KERNEL_PATCH="${GITHUB_WORKSPACE}/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch"

          echo
          echo "========================================"
          echo "VERIFYING SUSFS FILES"
          echo "========================================"

          if [ ! -f "$KSU_PATCH" ] || [ ! -f "$KERNEL_PATCH" ] || [ ! -f "${GITHUB_WORKSPACE}/susfs4ksu/kernel_patches/fs/susfs.c" ]; then
            echo "WARNING: File patch SUSFS tidak lengkap. Skipping SUSFS."
            echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo
          echo "========================================"
          echo "TESTING KERNELSU SUSFS PATCH"
          echo "========================================"

          cd "${GITHUB_WORKSPACE}/KernelSU-Next"

          if patch --dry-run -p1 --forward < "$KSU_PATCH" > /tmp/susfs_ksu_test.log 2>&1; then
            echo "KernelSU SUSFS patch: COMPATIBLE"
          else
            echo "KernelSU SUSFS patch: NOT COMPATIBLE"
            cat /tmp/susfs_ksu_test.log
            echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo
          echo "========================================"
          echo "TESTING KERNEL SUSFS PATCH"
          echo "========================================"

          cd "${GITHUB_WORKSPACE}"

          if patch --dry-run -p1 --forward < "$KERNEL_PATCH" > /tmp/susfs_kernel_test.log 2>&1; then
            echo "Kernel SUSFS patch: COMPATIBLE"
          else
            echo "Kernel SUSFS patch: NOT COMPATIBLE"
            cat /tmp/susfs_kernel_test.log
            echo "SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo
          echo "========================================"
          echo "APPLYING PATCHES & COPYING SOURCES"
          echo "========================================"

          cd "${GITHUB_WORKSPACE}/KernelSU-Next"
          patch -p1 --forward < "$KSU_PATCH"

          cd "${GITHUB_WORKSPACE}"
          cp susfs4ksu/kernel_patches/fs/* fs/
          cp susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 --forward < "$KERNEL_PATCH"

          echo "SUSFS_ENABLED=true" >> "$GITHUB_ENV"
          echo "SUSFS successfully applied."

      # ============================================================
      # CONFIGURE KERNEL
      # ============================================================

      - name: Configure Kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:${PATH}"

          echo "========================================"
          echo "CONFIGURING KERNEL"
          echo "========================================"

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            defconfig

          # KernelSU & Kprobes
          ./scripts/config --enable CONFIG_KSU
          ./scripts/config --enable CONFIG_KPROBES
          ./scripts/config --enable CONFIG_HAVE_KPROBES
          ./scripts/config --enable CONFIG_KPROBE_EVENTS

          # ThinLTO
          ./scripts/config --enable CONFIG_LTO
          ./scripts/config --enable CONFIG_LTO_CLANG
          ./scripts/config --disable CONFIG_LTO_CLANG_FULL
          ./scripts/config --enable CONFIG_LTO_CLANG_THIN

          # SUSFS Config
          if [ "${SUSFS_ENABLED:-false}" = "true" ]; then
            echo "Enabling SUSFS configurations"
            ./scripts/config --enable CONFIG_KSU_SUSFS
            ./scripts/config --enable CONFIG_KSU_SUSFS_SUS_PATH
            ./scripts/config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
            ./scripts/config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
            ./scripts/config --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
            ./scripts/config --enable CONFIG_KSU_SUSFS_ENABLE_LOG
            ./scripts/config --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            ./scripts/config --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            ./scripts/config --enable CONFIG_KSU_SUSFS_SUS_MAP
            ./scripts/config --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT
          else
            echo "Disabling SUSFS configurations"
            ./scripts/config --disable CONFIG_KSU_SUSFS || true
            ./scripts/config --disable CONFIG_KSU_SUSFS_SUS_PATH || true
            ./scripts/config --disable CONFIG_KSU_SUSFS_SUS_MOUNT || true
            ./scripts/config --disable CONFIG_KSU_SUSFS_SUS_KSTAT || true
            ./scripts/config --disable CONFIG_KSU_SUSFS_SPOOF_UNAME || true
            ./scripts/config --disable CONFIG_KSU_SUSFS_ENABLE_LOG || true
            ./scripts/config --disable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS || true
            ./scripts/config --disable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG || true
            ./scripts/config --disable CONFIG_KSU_SUSFS_SUS_MAP || true
            ./scripts/config --disable CONFIG_KSU_SUSFS_OPEN_REDIRECT || true
          fi

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build Kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-22/bin:${PATH}"

          echo "========================================"
          echo "BUILDING TEMPLAR KERNEL WITH CLANG 22"
          echo "========================================"

          clang --version | head -n 1
          ld.lld --version | head -n 1
          echo "Available CPU: $(nproc)"

          # KCFLAGS ditambahkan agar warning baru dari Clang 22 tidak menghentikan build kernel
          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LTO=thin \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            -j$(nproc) \
            Image

      # ============================================================
      # VERIFY ARTIFACTS
      # ============================================================

      - name: Verify Kernel Image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="arch/arm64/boot/Image"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Kernel Image not found!"
            exit 1
          fi

          echo "========================================"
          echo "KERNEL IMAGE VERIFIED"
          echo "========================================"
          ls -lh "$IMAGE"
          file "$IMAGE"
          strings "$IMAGE" | grep -m1 "Linux version" || true

      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================

      - name: Prepare Artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          cp arch/arm64/boot/Image output/Image
          cp .config output/kernel.config

          [ -f System.map ] && cp System.map output/System.map
          [ -f Module.symvers ] && cp Module.symvers output/Module.symvers

          echo "========================================"
          echo "OUTPUT FILES"
          echo "========================================"
          ls -lah output

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Templar-KernelSU-Next-Clang22
          path: output/
          if-no-files-found: error
          retention-days: 14
